<!DOCTYPE html>
<html dir="ltr" lang="pt-br">

<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cartão Digital Luiz Gustavo</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./all.min.js"></script>
</head>

<body>
    <main class="wrapper" aria-label="Cartão digital de Luiz Gustavo Lazarini">
        <div class="card front-face">
            <img src="IMG/EU (1).jpeg" alt="Luiz Gustavo Lazarini">
            <div class="front-caption">
                <span class="eyebrow">CARTÃO DIGITAL</span>
                <span class="front-name">Luiz Gustavo Lazarini</span>
                <button class="flip-button" type="button" data-flip-card aria-label="Virar o cartão para ver os contatos">
                    Ver contatos <span aria-hidden="true">↗</span>
                </button>
            </div>
        </div>
        <div class="card back-face">
            <button class="flip-button flip-button-back" type="button" data-flip-card aria-label="Voltar à frente do cartão">
                <span aria-hidden="true">↶</span> Voltar à capa
            </button>
            <img src="IMG/EU (4).jpeg" alt="Retrato de Luiz Gustavo Lazarini">
            <div class="info">
                <p class="eyebrow">OLÁ, EU SOU</p>
                <h1 class="title">Luiz Gustavo Lazarini</h1>
                <p class="skills">Citizen Developer <span aria-hidden="true">·</span> Front-End<br> Lógica de Programação <span aria-hidden="true">·</span> Scrum</p>
            </div>
            <p class="contact-heading">Vamos nos conectar</p>
            <div class="box">
                <ul aria-label="Links de contato">
                    <li><a href="https://sites.google.com/view/eventos-em-botucatu/calendario-2026" title="Calendário de eventos" aria-label="Calendário de eventos"><i class="fa fa-eye" aria-hidden="true"></i></a></li>
                    <li><a href="https://www.facebook.com/luiz.gustavo.laz" title="Facebook" aria-label="Facebook"><i class="fab fa-facebook" aria-hidden="true"></i></a></li>
                    <li><a href="https://www.linkedin.com/in/luiz-gustavo-lazrini-787000a1b3" title="LinkedIn" aria-label="LinkedIn"><i class="fab fa-linkedin" aria-hidden="true"></i></a></li>
                    <li><a href="https://www.instagram.com/luizgustavolazarini" title="Instagram" aria-label="Instagram"><i class="fab fa-instagram" aria-hidden="true"></i></a></li>
                    <li><a href="https://wa.me/5514991017844" title="WhatsApp" aria-label="WhatsApp"><i class="fab fa-whatsapp" aria-hidden="true"></i></a></li>
                    <li><a href="mailto:luizgustavolaz@gmail.com" title="E-mail" aria-label="E-mail"><i class="fas fa-mail-bulk" aria-hidden="true"></i></a></li>
                </ul>
            </div>
        </div>
    </main>
    <footer>Luiz Gustavo Lazarini <span aria-hidden="true">·</span> The Guardian</footer>
    <script>
        const card = document.querySelector('.wrapper');

        card.addEventListener('click', (event) => {
            if (event.target.closest('[data-flip-card]')) {
                card.classList.toggle('is-flipped');
            }
        });
    </script>
</body>

</html>
